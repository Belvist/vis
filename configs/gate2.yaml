# Gate 2 Overfit Config - UI Screenshot Understanding
# Target: Learn UI components from screenshots

# Model
feature_dim: 256
num_scene_tokens: 16
num_ui_classes: 15
style_dim: 8

# Backbone
backbone_pretrained: true
peripheral_resolution: [224, 224]
fovea_resolution: [600, 600]
max_entities: 50

# Training
batch_size: 8
num_workers: 0
lr: 0.0001
weight_decay: 0.0001
epochs: 100
eval_every: 10

# Data - Browser-rendered web UI
data_root: "./data/web_ui"
split: "train"

# Browser dataset URLs (will be rendered via Playwright)
urls:
  - "https://stripe.com"
  - "https://linear.app"
  - "https://vercel.com"
  - "https://github.com"
  - "https://tailwindcss.com"
  - "https://react.dev"
  - "https://nextjs.org"
  - "https://figma.com"
  - "https://notion.so"
  - "https://airbnb.com"

# Viewport sizes for responsive coverage
viewport_sizes:
  - [1440, 900]
  - [1920, 1080]
  - [1366, 768]
  - [375, 667]
  - [768, 1024]

# Device
device: "auto"

# Force browser dataset generation (no COCO/synthetic fallback)
force_browser_dataset: true