name: Gate 2 contracts

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install EarAI and test dependencies
        run: python -m pip install -e . "pytest>=8" "scipy>=1.10" "pillow>=10"
      - name: Verify Gate 2 contracts without pretrained downloads
        run: python -m pytest src/earai/tests/test_gate2_contracts.py -q
